name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LCM_SKIP_CACHE_SYNC: "1"
    steps:
      - name: Prepare isolated job directories
        run: |
          mkdir -p "$RUNNER_TEMP/lcm-home" "$RUNNER_TEMP/lcm-tmp"
          {
            printf 'HOME=%s/lcm-home\n' "$RUNNER_TEMP"
            printf 'TMPDIR=%s/lcm-tmp\n' "$RUNNER_TEMP"
            printf 'TMP=%s/lcm-tmp\n' "$RUNNER_TEMP"
            printf 'TEMP=%s/lcm-tmp\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ripgrep (bench baseline)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Verify ripgrep
        run: rg --version

      - name: Install the claude CLI
        # Pinned: a new CLI can add checks and turn the required check red with
        # no change in this repository. See docs/ci-runner.md.
        run: npm install -g @anthropic-ai/claude-code@2.1.318

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check manifest
        run: npm run check-manifest

      - name: Check documentation claims against the code
        run: npm run check-docs

      - name: Check the agent contract
        # tools/self-consistency/checker.pyz is a pinned, stdlib-only artifact; its
        # lock file records the version and digest. See AGENTS.md.
        run: npm run check-agents

      - name: Validate plugin manifest
        # Each manifest is named, because --strict applies only to the marketplace.
        # On the plugin walk it would fail on one structural warning: CLAUDE.md at
        # the root is this repo's project-instruction file, not plugin context, and
        # this repo is both a project and a plugin. See docs/ci-runner.md.
        run: |
          claude plugin validate --strict .claude-plugin/marketplace.json
          claude plugin validate .claude-plugin/plugin.json

      - name: Run tests
        run: npm test

      - name: Check for workspace artifacts
        run: |
          UNTRACKED=$(git status --porcelain | grep "^??" | grep -vE "^\?\? (node_modules|dist)/" || true)
          if [ -n "$UNTRACKED" ]; then
            echo "❌ Tests or build left unexpected untracked files in the workspace:"
            echo "$UNTRACKED"
            echo ""
            echo "Ensure all temp files go to os.tmpdir(), not process.cwd(). Tests must clean up after themselves."
            exit 1
          fi
          echo "✅ Workspace is clean"
