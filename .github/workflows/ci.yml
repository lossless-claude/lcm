name: CI

on:
  push:
    branches:
      - main
      - release
  pull_request:
  workflow_dispatch:
    inputs:
      hosted:
        description: Use GitHub-hosted Linux when the Mac mini is unavailable
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Fork code stays off the persistent host. Keep one stable required check.
    runs-on: ${{ fromJSON((inputs.hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-latest"]' || '["self-hosted","macOS","ARM64","lcm"]') }}
    timeout-minutes: 30
    env:
      LCM_SKIP_CACHE_SYNC: "1"
    steps:
      - name: Prepare isolated job directories
        run: |
          mkdir -p "$RUNNER_TEMP/lcm-home" "$RUNNER_TEMP/lcm-tmp"
          {
            printf 'HOME=%s/lcm-home\n' "$RUNNER_TEMP"
            printf 'TMPDIR=%s/lcm-tmp\n' "$RUNNER_TEMP"
            printf 'TMP=%s/lcm-tmp\n' "$RUNNER_TEMP"
            printf 'TEMP=%s/lcm-tmp\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ripgrep (bench baseline)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Verify ripgrep
        run: rg --version

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check manifest
        run: npm run check-manifest

      - name: Validate plugin manifest
        # Two invocations, because they validate different things: the repo root
        # holds both manifests and marketplace.json wins there, so the plugin's
        # own agents, skills, commands and hooks are only walked when plugin.json
        # is named. --strict on that walk would fail on one structural warning:
        # CLAUDE.md at the root is this repo's project-instruction file, not
        # plugin context, and this repo is both a project and a plugin. Errors
        # still fail without it — that walk is what caught four agents whose
        # frontmatter never parsed. Fork runners have no `claude`, so a missing
        # binary skips loudly rather than going red. See docs/ci-runner.md.
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::warning title=plugin validate skipped::claude CLI not on PATH on this runner; the plugin and marketplace manifests were not structurally validated this run (see docs/ci-runner.md)"
            exit 0
          fi
          claude plugin validate --strict .
          claude plugin validate .claude-plugin/plugin.json

      - name: Run tests
        run: npm test

      - name: Check for workspace artifacts
        run: |
          UNTRACKED=$(git status --porcelain | grep "^??" | grep -vE "^\?\? (node_modules|dist)/" || true)
          if [ -n "$UNTRACKED" ]; then
            echo "❌ Tests or build left unexpected untracked files in the workspace:"
            echo "$UNTRACKED"
            echo ""
            echo "Ensure all temp files go to os.tmpdir(), not process.cwd(). Tests must clean up after themselves."
            exit 1
          fi
          echo "✅ Workspace is clean"
