name: Update Gitleaks Patterns

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: update-gitleaks-patterns
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  update-patterns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run update-gitleaks-patterns
        run: npx tsx scripts/update-gitleaks-patterns.ts

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet --ignore-matching-lines='^// Updated:' -- src/generated-patterns.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No pattern changes — skipping commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Extract new rule count from updated file
            count=$(grep -oP '(?<=// Rules: )\d+' src/generated-patterns.ts || echo "?")
            echo "rule_count=$count" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pattern-count snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          count=$(grep -oP '(?<=// Rules: )\d+' src/generated-patterns.ts)
          updated=$(grep -oP '(?<=// Updated: )\d{4}-\d{2}-\d{2}' src/generated-patterns.ts)
          node - "$count" "$updated" <<'NODE'
          const fs = require("node:fs");
          const path = "test/bin/golden/snapshots/s03.out";
          const [count, updated] = process.argv.slice(2);
          const snapshot = fs.readFileSync(path, "utf8").replace(
            /\[gitleaks\]\s+\d+ patterns \(synced \d{4}-\d{2}-\d{2}\)/,
            `[gitleaks]  ${count} patterns (synced ${updated})`,
          );
          fs.writeFileSync(path, snapshot);
          NODE

      - name: Add changeset
        if: steps.diff.outputs.changed == 'true'
        run: |
          printf '%s\n' \
            '---' \
            '"@lossless-claude/lcm": patch' \
            '---' \
            '' \
            'Update the bundled secret-detection patterns from gitleaks.' \
            > .changeset/update-gitleaks-patterns.md

      - name: Commit, push, and open pull request
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/update-gitleaks-patterns"
          git config user.name "gitleaks-patterns-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add src/generated-patterns.ts test/bin/golden/snapshots/s03.out .changeset/update-gitleaks-patterns.md
          git commit -m "chore(security): sync gitleaks patterns → ${{ steps.diff.outputs.rule_count }} rules"
          git push --force-with-lease origin "$branch"

          body=$(cat <<'EOF'
          ## Changes
          - Refresh the bundled secret-detection patterns from upstream gitleaks.
          - Add a patch changeset for the published pattern update.

          ## Test evidence
          - Generated and JavaScript-validated by `scripts/update-gitleaks-patterns.ts`.
          - Full repository checks run on this pull request.

          _Created automatically by the Update Gitleaks Patterns workflow._
          EOF
          )
          pr_number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "chore(security): sync gitleaks patterns" \
              --body "$body"
            pr_url=$(gh pr view "$pr_number" --json url --jq .url)
          else
            pr_url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(security): sync gitleaks patterns" \
              --body "$body")
          fi
          # Pull requests created by github.token do not emit a usable required
          # check. Run CI explicitly, then mirror its result to the PR head.
          sha=$(git rev-parse HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state=pending \
            -f context=ci \
            -f description="Dispatched repository CI is running"
          if ! ci_url=$(gh workflow run ci.yml --ref "$branch" -f hosted=true); then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state=failure \
              -f context=ci \
              -f description="Failed to dispatch repository CI"
            exit 1
          fi
          ci_run_id=${ci_url##*/}
          if gh run watch "$ci_run_id" --exit-status; then
            ci_state=success
            ci_description="Dispatched repository CI passed"
          else
            ci_state=failure
            ci_description="Dispatched repository CI failed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state="$ci_state" \
            -f context=ci \
            -f description="$ci_description" \
            -f target_url="$ci_url"
          [ "$ci_state" = success ]
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "### Gitleaks Patterns Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Rules:** ${{ steps.diff.outputs.rule_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pull request:** ${{ steps.pr.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Merge after the required checks pass." >> "$GITHUB_STEP_SUMMARY"

      - name: No-op summary
        if: steps.diff.outputs.changed == 'false'
        run: |
          echo "### No Gitleaks Pattern Changes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gitleaks patterns are up to date — no commit needed." >> "$GITHUB_STEP_SUMMARY"
