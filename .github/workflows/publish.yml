name: Publish Package

on:
  push:
    # `main` is the release branch: merging the changesets version PR bumps
    # package.json, which publishes. The guard below skips a version that is
    # already on npm or already tagged, so ordinary merges are no-ops.
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      ref:
        description: Optional git ref to publish. Leave blank to use the selected branch or tag.
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Check if version already released
        id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          tag="v$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Package $name@$version already published to npm — skipping publish"
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Git tag $tag already exists (but npm version not found) — skipping publish"
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'skip=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      # Kept in step with ci.yml: the hook-process e2e tests exec dist/bin/lcm.js
      # and the bench baseline shells out to ripgrep, so both must exist first.
      - name: Install ripgrep (bench baseline)
        if: steps.check.outputs.skip == 'false'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Type-check
        if: steps.check.outputs.skip == 'false'
        run: npm run typecheck

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: npm run build

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: npm test

      # Trusted publishing (OIDC) needs npm 11.5.1+; Node 22 ships npm 10.x.
      # Upgraded only here, after the build and tests have run on the stock
      # npm, so the release artifact is built exactly as CI builds it. Pinned
      # below 12, whose install defaults (allowScripts off) would change how
      # dependencies install.
      - name: Upgrade npm for trusted publishing
        if: steps.check.outputs.skip == 'false'
        run: npm install -g npm@^11.5.1

      # No NODE_AUTH_TOKEN: the registry authenticates the workflow itself
      # through the OIDC token granted by `id-token: write`. 2FA-bypass
      # automation tokens lose direct publish around January 2027.
      - name: Publish to npm via trusted publishing
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public

      - name: Create and push release tag
        if: steps.check.outputs.skip == 'false'
        run: |
          tag="v${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

      - name: Create GitHub release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.check.outputs.version }}"
          gh release create "$tag" --generate-notes --verify-tag

      - name: Enrich release notes
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Top version block from CHANGELOG.md, without its own heading.
          awk "/^## \\[${VERSION}\\]/{found=1; next} found && /^## \\[/{exit} found{print}" CHANGELOG.md > /tmp/changelog-block.md
          # Written to a file rather than an inline string: the notes contain
          # lines that must start at column 0, which a YAML block scalar cannot
          # hold without ending itself.
          {
            printf '📦 **npm:** `npm install @lossless-claude/lcm@%s`\n\n' "$VERSION"
            printf -- '---\n\n## Changelog\n\n'
            cat /tmp/changelog-block.md
            printf -- '\n---\n\n🔖 [Full Changelog](https://github.com/lossless-claude/lcm/blob/main/CHANGELOG.md)\n'
          } > /tmp/release-notes.md
          gh release edit "v${VERSION}" --notes-file /tmp/release-notes.md
